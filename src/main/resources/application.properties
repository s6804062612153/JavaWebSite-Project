server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
spring.web.resources.cache.cachecontrol.max-age=1h

# ---------------------------------------------------------------------------
# Database
# Default: in-memory H2. Fast and zero-setup, but empty on every restart; the
# questions are re-loaded from src/main/resources/data/questions.txt each time.
#
# To keep data between restarts, override these with environment variables
# (Spring maps SPRING_DATASOURCE_URL -> spring.datasource.url, etc.):
#   local file H2 : SPRING_DATASOURCE_URL=jdbc:h2:file:./data/quizdb
#   PostgreSQL    : SPRING_DATASOURCE_URL=jdbc:postgresql://HOST:5432/DBNAME
#                   SPRING_DATASOURCE_USERNAME=...  SPRING_DATASOURCE_PASSWORD=...
# The JDBC driver and Hibernate dialect are detected from the URL.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# H2 web console is OFF by default. For local debugging run with H2_CONSOLE=true
# and open http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:quizdb).
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# JPA / Hibernate
# ddl-auto: "update" creates/extends tables; use "validate" once a schema is managed by hand.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Admin dashboard is read-only at the UI level and does not require an API key.
